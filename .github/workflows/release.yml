name: Release
# Push a tag like v1.2.0 -> builds, signs and publishes the app + Sparkle appcast.
# Release notes: docs/releases/<version>.md (falls back to the tag message).
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SPARKLE_VERSION: "2.10.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || echo "MetalToolchain not needed/available"
      - run: brew install xcodegen
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          scripts/build-app.sh "$VERSION" "${GITHUB_RUN_NUMBER}"
      - name: Sign app
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
        run: |
          APP="build/Build/Products/Release/Scribe Sync.app"
          if [ -n "$SIGNING_CERT_P12" ]; then
            KC="$RUNNER_TEMP/signing.keychain-db"
            security create-keychain -p ci "$KC"
            security set-keychain-settings -lut 3600 "$KC"
            security unlock-keychain -p ci "$KC"
            echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P scribesync -T /usr/bin/codesign
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
            security find-certificate -c "Scribe Sync Signing" -p "$KC" > "$RUNNER_TEMP/cert.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
            codesign --force --deep --timestamp=none --sign "Scribe Sync Signing" --keychain "$KC" "$APP"
          else
            echo "::warning::SIGNING_CERT_P12 secret missing – ad-hoc signature (permissions are asked again after updates)"
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|Identifier|Signature" || true
      - name: Package and sign update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "::error::SPARKLE_PRIVATE_KEY secret missing"; exit 1; }
          ZIP="ScribeSync-${VERSION}.zip"
          cd build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent "Scribe Sync.app" "$GITHUB_WORKSPACE/$ZIP"
          cd "$GITHUB_WORKSPACE"
          curl -sSL -o sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir sparkle && tar -xf sparkle.tar.xz -C sparkle
          SIG_LINE=$(echo "$SPARKLE_PRIVATE_KEY" | sparkle/bin/sign_update --ed-key-file - "$ZIP")
          echo "$SIG_LINE"
          SIG=$(echo "$SIG_LINE" | sed -E 's/.*sparkle:edSignature="([^"]+)".*/\1/')
          LEN=$(stat -f%z "$ZIP")
          NOTES="docs/releases/${VERSION}.md"
          if [ ! -f "$NOTES" ]; then git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md; NOTES=notes.md; fi
          python3 scripts/make_appcast.py "$VERSION" "$BUILD" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP}" \
            "$LEN" "$SIG" "$NOTES" appcast.xml
          cat appcast.xml
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" appcast.xml \
            --title "Scribe Sync ${VERSION}" --notes-file "$NOTES" --latest
      - name: Publish log
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish-ci-log.sh build.log
