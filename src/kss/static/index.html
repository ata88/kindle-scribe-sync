<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scribe Notizen</title>
<style>
:root {
  --bg: #f6f3ee; --panel: #fffdf9; --ink: #1f1d1a; --muted: #77716a; --line: #e6e0d6;
  --accent: #2f6f5e; --accent-ink: #fff; --hl: #fff2a8; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161513; --panel: #1f1e1b; --ink: #ece8e1; --muted: #9a948b; --line: #2f2d29;
          --accent: #6fbfa6; --accent-ink: #10201b; --hl: #5b5222; --shadow: none; }
  .page img { filter: invert(.92) hue-rotate(180deg); }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
.app { display: grid; grid-template-columns: 290px 1fr; height: 100vh; }
aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 18px 18px 10px; font-weight: 650; letter-spacing: -.01em; font-size: 17px; }
.brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.search { margin: 0 14px 10px; }
.search input { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
nav { overflow: auto; padding: 4px 8px 20px; flex: 1; }
.folder { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 14px 10px 4px; }
.nb { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.nb:hover { background: var(--bg); }
.nb.active { background: var(--accent); color: var(--accent-ink); }
.nb .meta { font-size: 12px; opacity: .7; }
.badge { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #d08a2b; margin-left: 6px; vertical-align: middle; }
main { overflow: auto; min-width: 0; }
header.top { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center; padding: 14px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header.top h1 { font-size: 20px; margin: 0; flex: 1; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 12px; border-radius: 9px; cursor: pointer; font: inherit; font-size: 13px; }
button.btn:hover { border-color: var(--accent); }
button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.content { padding: 24px 28px 80px; max-width: 1300px; }
.page { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 18px; box-shadow: var(--shadow); }
.textonly .page { grid-template-columns: 1fr; }
.textonly .page .img { display: none; }
.page .img img { width: 100%; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: zoom-in; }
.page .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; color: var(--muted); font-size: 13px; }
.md h1 { font-size: 1.35em; } .md h2 { font-size: 1.18em; } .md h3 { font-size: 1.05em; }
.md h1, .md h2, .md h3 { margin: .6em 0 .3em; letter-spacing: -.01em; }
.md p { margin: .4em 0; } .md ul, .md ol { padding-left: 1.4em; margin: .3em 0; }
.md blockquote { margin: .5em 0; padding: .3em .8em; border-left: 3px solid var(--accent); color: var(--muted); }
.md table { border-collapse: collapse; margin: .5em 0; } .md td, .md th { border: 1px solid var(--line); padding: 4px 8px; }
.md code { background: var(--bg); padding: 1px 4px; border-radius: 4px; }
.md .unclear { background: var(--hl); border-radius: 3px; padding: 0 2px; }
.err { color: #c0563b; font-size: 13px; }
.empty { color: var(--muted); padding: 80px 28px; text-align: center; }
.results .hit { display: block; padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 8px; cursor: pointer; }
.results .hit b { display: block; }
.results .hit span { color: var(--muted); font-size: 13px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
dialog img { max-width: 96vw; max-height: 96vh; background: #fff; border-radius: 8px; }
dialog::backdrop { background: rgba(0,0,0,.6); }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; height: auto; }
  aside { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .page { grid-template-columns: 1fr; }
  .content, header.top { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">✍️ Scribe Notizen<small id="count">lädt …</small></div>
    <div class="search"><input id="q" type="search" placeholder="Alle Notizen durchsuchen …" autocomplete="off"></div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"><div class="empty">Wähle links ein Notizbuch.</div></main>
</div>
<div class="toast" id="toast"></div>
<dialog id="zoom"><img alt=""></dialog>
<script>
const $ = (s, el = document) => el.querySelector(s);
let notebooks = [], current = null, textOnly = false;
try { textOnly = localStorage.getItem("kss-textonly") === "1"; } catch {}

function esc(s) { return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
    .replace(/(\S*\[\?\]|\[unleserlich\])/g, '<span class="unclear">$1</span>');
}
function md(src) {
  const lines = (src || "").split("\n"); let out = "", list = null, table = [];
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r));
    out += "<table>" + rows.map((r, i) => "<tr>" + r.replace(/^\||\|$/g, "").split("|").map(c => `<${i ? "td" : "th"}>${inline(c.trim())}</${i ? "td" : "th"}>`).join("") + "</tr>").join("") + "</table>";
    table = [];
  };
  for (const raw of lines) {
    const l = raw.replace(/\s+$/, "");
    if (/^\s*\|.*\|\s*$/.test(l)) { close(); table.push(l.trim()); continue; } else flushTable();
    let m;
    if (!l.trim()) { close(); continue; }
    if ((m = l.match(/^(#{1,3})\s+(.*)/))) { close(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; continue; }
    if ((m = l.match(/^>\s?(.*)/))) { close(); out += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if ((m = l.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)/))) { if (list !== "ul") { close(); out += "<ul style='list-style:none;padding-left:.3em'>"; list = "ul"; } out += `<li>${m[1] === " " ? "☐" : "☑"} ${inline(m[2])}</li>`; continue; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out += "<ol>"; list = "ol"; } out += `<li>${inline(m[1])}</li>`; continue; }
    close(); out += `<p>${inline(l)}</p>`;
  }
  close(); flushTable(); return out;
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1400); }
async function copy(text) { await navigator.clipboard.writeText(text); toast("In die Zwischenablage kopiert"); }

async function loadList() {
  notebooks = await (await fetch("/api/notebooks")).json();
  $("#count").textContent = `${notebooks.length} Notizbücher`;
  const groups = {};
  for (const n of notebooks) (groups[n.folder.join(" / ") || ""] ||= []).push(n);
  $("#nav").innerHTML = Object.keys(groups).sort().map(g =>
    (g ? `<div class="folder">${esc(g)}</div>` : "") + groups[g].map(n =>
      `<button class="nb ${current === n.id ? "active" : ""}" data-id="${esc(n.id)}">${esc(n.title)}${n.status !== "done" ? '<span class="badge" title="' + esc(n.error || n.status) + '"></span>' : ""}<div class="meta">${n.pages} Seite${n.pages === 1 ? "" : "n"}</div></button>`
    ).join("")).join("") || '<div class="empty">Noch nichts synchronisiert.</div>';
}

async function openNb(id, scrollTo) {
  current = id; history.replaceState(null, "", "#" + encodeURIComponent(id));
  document.querySelectorAll(".nb").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  const nb = await (await fetch("/api/notebooks/" + encodeURIComponent(id))).json();
  const all = nb.pages.map(p => `## Seite ${p.index + 1}\n\n${p.text || ""}`).join("\n\n");
  $("#main").innerHTML = `
    <header class="top"><h1>${esc(nb.title)}</h1>
      <button class="btn" id="toggle">${textOnly ? "Mit Seitenbild" : "Nur Text"}</button>
      <button class="btn primary" id="copyall">Alles kopieren</button></header>
    <div class="content ${textOnly ? "textonly" : ""}">${nb.pages.map(p => `
      <section class="page" id="p${p.index}">
        <div class="img"><img loading="lazy" src="${p.image}" alt="Seite ${p.index + 1}"></div>
        <div><div class="head"><span>Seite ${p.index + 1}</span><button class="btn" data-copy="${p.index}">Kopieren</button></div>
          ${p.error ? `<div class="err">⚠︎ ${esc(p.error)}</div>` : ""}
          <div class="md">${md(p.text)}</div></div>
      </section>`).join("")}</div>`;
  $("#copyall").onclick = () => copy(`# ${nb.title}\n\n${all}`);
  $("#toggle").onclick = () => { textOnly = !textOnly; try { localStorage.setItem("kss-textonly", textOnly ? "1" : "0"); } catch {} openNb(id); };
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(nb.pages[+b.dataset.copy].text || ""));
  document.querySelectorAll(".page .img img").forEach(img => img.onclick = () => { $("#zoom img").src = img.src; $("#zoom").showModal(); });
  if (scrollTo != null) document.getElementById("p" + scrollTo)?.scrollIntoView({ block: "start" });
}

let searchTimer;
$("#q").addEventListener("input", e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (q.length < 2) { if (current) openNb(current); return; }
  searchTimer = setTimeout(async () => {
    const hits = await (await fetch("/api/search?q=" + encodeURIComponent(q))).json();
    $("#main").innerHTML = `<header class="top"><h1>Suche: „${esc(q)}“</h1></header><div class="content results">${
      hits.map(h => `<a class="hit" data-id="${esc(h.id)}" data-page="${h.page}"><b>${esc(h.title)} · Seite ${h.page + 1}</b><span>${esc(h.snippet)}</span></a>`).join("") || '<div class="empty">Nichts gefunden.</div>'}</div>`;
    document.querySelectorAll(".hit").forEach(a => a.onclick = () => openNb(a.dataset.id, +a.dataset.page));
  }, 200);
});
$("#nav").addEventListener("click", e => { const b = e.target.closest(".nb"); if (b) openNb(b.dataset.id); });
$("#zoom").addEventListener("click", () => $("#zoom").close());

loadList().then(() => {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h && notebooks.some(n => n.id === h)) openNb(h);
  else if (notebooks[0]) openNb(notebooks[0].id);
});
setInterval(loadList, 60000);
</script>
</body>
</html>
